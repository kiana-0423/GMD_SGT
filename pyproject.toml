[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmd-sgt"
dynamic = ["version"]
description = "Unified SE(3)-equivariant machine learning interatomic potential"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "ase>=3.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Equivariant tensor products: required for non-scalar irreps in
# UnifiedEquivariantMLIP (the default) and for AllegroStyleBackbone l_max > 2
e3nn = ["e3nn>=0.5"]
# Fast graph construction
cluster = ["torch-cluster>=1.6", "torch-scatter>=2.1"]
# Progress bars
tqdm = ["tqdm>=4.65"]
# All optional extras
full = ["gmd-sgt[e3nn,cluster,tqdm]"]
# Development / testing
dev = [
    "gmd-sgt[full]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
gmd-train  = "gmd_sgt.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gmd_sgt.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["gmd_sgt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
filterwarnings = ["ignore::UserWarning"]
